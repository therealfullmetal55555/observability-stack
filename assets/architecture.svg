<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0A0A0A; }
      .grid-line { stroke: #181818; stroke-width: 1; }
      .box { fill: #111111; stroke: #262626; stroke-width: 1.5; rx: 4px; }
      .box-active { fill: #141414; stroke: #00FF66; stroke-width: 1.5; rx: 4px; }
      .box-alert { fill: #1A1414; stroke: #FF3366; stroke-width: 1.5; rx: 4px; }
      .text-title { font-family: 'SF Mono', 'Courier New', monospace; font-size: 13px; fill: #FFFFFF; font-weight: bold; letter-spacing: 1px; }
      .text-sub { font-family: 'SF Mono', 'Courier New', monospace; font-size: 11px; fill: #888888; }
      .text-accent { font-family: 'SF Mono', 'Courier New', monospace; font-size: 11px; fill: #00FF66; }
      .text-alert { font-family: 'SF Mono', 'Courier New', monospace; font-size: 11px; fill: #FF3366; }
      .line { stroke: #333333; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .line-solid { stroke: #00FF66; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="480" class="bg" />
  
  <!-- Grid Lines -->
  <line x1="0" y1="80" x2="1000" y2="80" class="grid-line" />
  <line x1="0" y1="400" x2="1000" y2="400" class="grid-line" />
  <line x1="200" y1="0" x2="200" y2="480" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="480" class="grid-line" />

  <!-- Header -->
  <text x="40" y="50" class="text-title">// ARCHITECTURE :: AI_AGENT_OBSERVABILITY_STACK</text>
  <text x="730" y="50" class="text-accent">[STATUS: TELEMETRY_ACTIVE]</text>

  <!-- AI AGENTS FLEET -->
  <rect x="40" y="150" width="180" height="180" class="box" />
  <text x="55" y="180" class="text-title">AI AGENT FLEET</text>
  <text x="55" y="205" class="text-sub">› Python &amp; TS Services</text>
  <text x="55" y="225" class="text-sub">› LangChain / LlamaIndex</text>
  <text x="55" y="245" class="text-sub">› n8n AI Workflows</text>
  <text x="55" y="265" class="text-accent">› gen_ai.* Attributes</text>
  <text x="55" y="285" class="text-sub">› Cost / Token Spans</text>

  <!-- BRIDGE -->
  <line x1="220" y1="240" x2="270" y2="240" class="line-solid" />

  <!-- OTEL COLLECTOR -->
  <rect x="270" y="130" width="220" height="220" class="box-active" />
  <text x="290" y="160" class="text-title">OTEL COLLECTOR</text>
  <text x="290" y="185" class="text-accent">› OTLP gRPC / HTTP</text>
  <text x="290" y="210" class="text-sub">› Cost Calculation Filter</text>
  <text x="290" y="235" class="text-sub">› Citation Coverage Math</text>
  <text x="290" y="260" class="text-sub">› Batch &amp; Memory Buffer</text>
  <text x="290" y="285" class="text-sub">› Span Metrics Generator</text>
  <text x="290" y="310" class="text-accent">› PII Masking Pipeline</text>

  <!-- EXPORTERS -->
  <line x1="490" y1="180" x2="560" y2="120" class="line" />
  <line x1="490" y1="240" x2="560" y2="240" class="line-solid" />
  <line x1="490" y1="300" x2="560" y2="360" class="line" />

  <!-- TEMPO TRACES -->
  <rect x="560" y="80" width="220" height="75" class="box" />
  <text x="575" y="105" class="text-title">TEMPO (TRACES)</text>
  <text x="575" y="125" class="text-sub">Retrieval vs Generation Spans</text>

  <!-- PROMETHEUS METRICS -->
  <rect x="560" y="200" width="220" height="75" class="box-active" />
  <text x="575" y="225" class="text-title">PROMETHEUS (METRICS)</text>
  <text x="575" y="245" class="text-accent">Cost / Model Token Rates / Latency</text>

  <!-- LOKI LOGS -->
  <rect x="560" y="320" width="220" height="75" class="box" />
  <text x="575" y="345" class="text-title">LOKI (LOGS)</text>
  <text x="575" y="365" class="text-sub">Prompt Refusals &amp; Tool Retries</text>

  <!-- GRAFANA & ALERTMANAGER -->
  <line x1="780" y1="240" x2="830" y2="240" class="line-solid" />

  <rect x="830" y="150" width="130" height="180" class="box-alert" />
  <text x="845" y="180" class="text-alert">GRAFANA &amp; ALERTS</text>
  <text x="845" y="205" class="text-sub">› 5 Dashboards</text>
  <text x="845" y="225" class="text-sub">› 15 Alert Rules</text>
  <text x="845" y="245" class="text-alert">› Budget Burn Alert</text>
  <text x="845" y="265" class="text-alert">› Hallucination Alert</text>
  <text x="845" y="285" class="text-accent">› Slack / PagerDuty</text>

  <!-- FOOTER -->
  <text x="40" y="435" class="text-sub">OTEL COLLECTOR → TEMPO · PROMETHEUS · LOKI · GRAFANA · ALERTMANAGER</text>
</svg>
