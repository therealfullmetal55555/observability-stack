[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-observability"
version = "1.0.0"
description = "OpenTelemetry + Grafana observability for AI agents: token cost, tool latency, citation coverage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "therealfullmetal55555" }]
keywords = ["opentelemetry", "observability", "ai-agents", "llm", "grafana", "tracing", "llmops"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]

dependencies = [
  "opentelemetry-api>=1.24,<2",
  "opentelemetry-sdk>=1.24,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.24,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.24,<2",
  "opentelemetry-propagator-b3>=1.24,<2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
auto = [
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-httpx>=0.45b0",
  "opentelemetry-instrumentation-requests>=0.45b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
  "opentelemetry-instrumentation-redis>=0.45b0",
  "opentelemetry-instrumentation-logging>=0.45b0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/therealfullmetal55555/observability-stack"
Issues = "https://github.com/therealfullmetal55555/observability-stack/issues"
Changelog = "https://github.com/therealfullmetal55555/observability-stack/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "instrumentation/python" }
packages = ["agent_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "unit: fast, no network",
  "integration: needs a running collector (skipped when OTLP unreachable)",
  "slow: takes more than a second",
]
filterwarnings = ["ignore::DeprecationWarning:opentelemetry.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["dist", ".venv", "instrumentation/n8n"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = [
  "E501",   # black owns line length
  "ARG001", # decorators legitimately accept unused args
  "ARG002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
"scripts/*" = ["T201"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["instrumentation/n8n", "scripts/"]

[tool.coverage.run]
source = ["instrumentation"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
