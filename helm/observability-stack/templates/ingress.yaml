{{- if .Values.grafana.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "observability.fullname" . }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
  {{- with .Values.grafana.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.grafana.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.grafana.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.grafana.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "observability.fullname" $ }}-grafana
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}

{{- if and .Values.grafana.enabled (not .Values.grafana.ingress.enabled) }}
{{/*
  No ingress, but Grafana is installed. Say so in the notes rather than leaving
  someone to guess why the URL 404s.
*/}}
{{- end }}
