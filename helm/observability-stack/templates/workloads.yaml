{{- $fullname := include "observability.fullname" . -}}

{{- if .Values.prometheus.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "observability.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 8 }}
      annotations:
        checksum/rules: {{ include (print $.Template.BasePath "/alerting.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $fullname }}-prometheus
      securityContext: { runAsUser: 65534, runAsNonRoot: true, fsGroup: 65534 }
      {{- with .Values.prometheus.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.prometheus.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --web.enable-lifecycle
            - --web.enable-admin-api
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
            - { name: data, mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ $fullname }}-prometheus }
        - name: rules
          configMap: { name: {{ $fullname }}-prometheus-rules }
        {{- if not .Values.prometheus.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.prometheus.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "observability.storageClass" .Values.prometheus.persistence | nindent 8 }}
        resources: { requests: { storage: {{ .Values.prometheus.persistence.size }} } }
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
spec:
  ports: [{ name: http, port: 9090, targetPort: http }]
  selector:
    {{- include "observability.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
---
# Prometheus discovers agent pods by annotation, so it needs read access to pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-prometheus
  labels:
    {{- include "observability.componentLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - nonResourceURLs: [/metrics]
    verbs: [get]
{{- end }}

{{- if .Values.loki.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "ctx" . "component" "loki") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-loki
  replicas: 1
  selector:
    matchLabels:
      {{- include "observability.selectorLabels" (dict "ctx" . "component" "loki") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability.selectorLabels" (dict "ctx" . "component" "loki") | nindent 8 }}
    spec:
      securityContext: { runAsUser: 10001, runAsNonRoot: true, fsGroup: 10001 }
      {{- with .Values.loki.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loki.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: loki
          image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{ name: http, containerPort: 3100 }]
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: data, mountPath: /var/loki }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ $fullname }}-loki }
        {{- if not .Values.loki.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.loki.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "observability.storageClass" .Values.loki.persistence | nindent 8 }}
        resources: { requests: { storage: {{ .Values.loki.persistence.size }} } }
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "ctx" . "component" "loki") | nindent 4 }}
spec:
  ports: [{ name: http, port: 3100, targetPort: http }]
  selector:
    {{- include "observability.selectorLabels" (dict "ctx" . "component" "loki") | nindent 4 }}
{{- end }}

{{- if .Values.grafana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
spec:
  replicas: {{ .Values.grafana.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "observability.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 8 }}
      annotations:
        # Grafana reads provisioning once at boot, so a changed dashboard needs
        # a restart. The hash makes that happen automatically.
        checksum/provisioning: {{ include (print $.Template.BasePath "/dashboards.yaml") . | sha256sum }}
    spec:
      securityContext: { runAsUser: 472, runAsNonRoot: true, fsGroup: 472 }
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.admin.user | quote }}
            {{- if not .Values.grafana.admin.existingSecret }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "observability.grafana.secretName" . }}
                  key: admin-password
            {{- else }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.admin.existingSecret }}
                  key: admin-password
            {{- end }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ALERTING_ENABLED
              value: {{ .Values.grafana.alerting.enabled | quote }}
            - name: GF_SERVER_ROOT_URL
              value: "https://{{ (first .Values.grafana.ingress.hosts).host }}{{ if not .Values.grafana.ingress.enabled }}:3000{{ end }}"
            {{- if .Values.grafana.alerting.slackWebhook }}
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef: { name: {{ include "observability.alerting.secretName" . }}, key: slack-webhook-url }
            {{- end }}
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning, readOnly: true }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }
            - { name: data, mountPath: /var/lib/grafana }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 45
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: provisioning
          configMap: { name: {{ $fullname }}-grafana-provisioning }
        - name: dashboards
          configMap: { name: {{ $fullname }}-grafana-dashboards }
        {{- if .Values.grafana.persistence.enabled }}
        - name: data
          persistentVolumeClaim: { claimName: {{ $fullname }}-grafana }
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
{{- if .Values.grafana.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- include "observability.storageClass" .Values.grafana.persistence | nindent 2 }}
  resources: { requests: { storage: {{ .Values.grafana.persistence.size }} } }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
spec:
  ports: [{ name: http, port: 3000, targetPort: http }]
  selector:
    {{- include "observability.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
{{- end }}

{{- if .Values.nodeExporter.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $fullname }}-node-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "ctx" . "component" "node-exporter") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "observability.selectorLabels" (dict "ctx" . "component" "node-exporter") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability.selectorLabels" (dict "ctx" . "component" "node-exporter") | nindent 8 }}
    spec:
      {{- with .Values.nodeExporter.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-exporter
          image: "{{ .Values.nodeExporter.image.repository }}:{{ .Values.nodeExporter.image.tag }}"
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/kubelet/.+)($$|/)
          ports: [{ name: metrics, containerPort: 9100 }]
          volumeMounts:
            - { name: proc, mountPath: /host/proc, readOnly: true }
            - { name: sys, mountPath: /host/sys, readOnly: true }
            - { name: root, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer }
      hostNetwork: true
      hostPID: true
      volumes:
        - { name: proc, hostPath: { path: /proc } }
        - { name: sys, hostPath: { path: /sys } }
        - { name: root, hostPath: { path: / } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-node-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.componentLabels" (dict "ctx" . "component" "node-exporter") | nindent 4 }}
spec:
  clusterIP: None
  ports: [{ name: metrics, port: 9100, targetPort: metrics }]
  selector:
    {{- include "observability.selectorLabels" (dict "ctx" . "component" "node-exporter") | nindent 4 }}
{{- end }}
