name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  GO_VERSION: "1.22"
  NODE_VERSION: "20"

jobs:
  config:
    name: config sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pyyaml
      - name: Validate compose, dashboards, alerts, collector pipeline
        run: python scripts/validate.py --strict

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check instrumentation scripts tests
          black --check instrumentation scripts tests
      - name: Types
        run: mypy instrumentation/python/agent_observability
      - name: Tests
        run: pytest tests -q --cov=agent_observability --cov-report=xml --cov-fail-under=70
      - uses: codecov/codecov-action@v4
        if: matrix.python == env.PYTHON_VERSION
        with:
          files: coverage.xml
          fail_ci_if_error: false

  processor:
    name: tokencost processor (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: otel-collector/processor/go.mod
      - name: Formatting
        run: |
          cd otel-collector/processor
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: cd otel-collector/processor && go vet ./...
      - name: Test
        run: cd otel-collector/processor && go test ./... -race -count=1 -cover

  n8n-nodes:
    name: n8n nodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: instrumentation/n8n/package-lock.json
      - run: cd instrumentation/n8n && npm ci
      - run: cd instrumentation/n8n && npm run build
      - run: cd instrumentation/n8n && npm run lint --if-present

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.3
      - name: Lint
        run: helm lint helm/observability-stack
      - name: Render defaults
        run: helm template observability helm/observability-stack > /tmp/default.yaml
      - name: Render production values
        run: helm template observability helm/observability-stack -f helm/observability-stack/values-production.yaml > /tmp/prod.yaml
      - name: Render with everything switched off
        run: |
          helm template observability helm/observability-stack \
            --set tempo.enabled=false,loki.enabled=false,prometheus.enabled=false,grafana.enabled=false
      - name: Install kubeconform and validate the manifests
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas -summary /tmp/default.yaml /tmp/prod.yaml
      - name: Verify chart copies are in sync with the repo
        run: |
          git diff --exit-code helm/observability-stack/dashboards helm/observability-stack/rules || {
            echo "::error::Run 'make helm-sync' and commit the result."
            exit 1
          }

  stack:
    name: stack integration
    runs-on: ubuntu-latest
    needs: [config]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start the stack
        run: |
          docker compose up -d --wait
          docker compose ps
      - name: Wait for the collector to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:13133/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "collector never became healthy"
          docker compose logs otel-collector
          exit 1
      - name: Push synthetic traffic
        run: python tests/load/generate_traffic.py --duration 20 --rate 10
      - name: Integration tests
        run: pytest tests -q -m integration
      - name: Seed and check the dashboards respond
        run: |
          python scripts/seed_demo_data.py --hours 1 --per-minute 10
          curl -fsS -u admin:admin "http://localhost:3000/api/search?type=dash-db" | tee /tmp/dashboards.json
          python - <<'PY'
          import json
          dashboards = json.load(open('/tmp/dashboards.json'))
          titles = {d['title'] for d in dashboards}
          expected = {'Agent Overview', 'Token Economics', 'Tool Calls & Latency',
                      'Hallucination Guard', 'Executive Summary'}
          missing = expected - titles
          assert not missing, f'missing dashboards: {missing} (got {titles})'
          print(f'{len(titles)} dashboards provisioned')
          PY
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  package:
    name: package
    runs-on: ubuntu-latest
    needs: [config, python, helm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: observability-stack
          path: |
            dist/*.tar.gz
            dist/*.filelist.txt
          retention-days: 30
